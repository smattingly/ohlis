<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav
      th:fragment="nav"
      class="navbar navbar-dark bg-dark navbar-expand-lg border-bottom border-body"
    >
      <div class="container-fluid">
        <a href="#" class="navbar-brand">OH LIS</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a
              th:href="@{/legislation}"
              th:class="${activePage == 'legislation'} ? 'nav-link active' : 'nav-link'"
              >Legislation</a
            >
            <a
              sec:authorize-url="/legislators"
              th:href="@{/legislators}"
              th:class="${activePage == 'legislators'} ? 'nav-link active' : 'nav-link'"
              >Legislators</a
            >
            <form th:action="@{/logout}" method="post">
              <button
                type="submit"
                style="
                  background: none;
                  border: none;
                  outline: none;
                  box-shadow: none;
                "
              >
                <span
                  class="fa fa-sign-out pt-2"
                  style="font-size: 24px; color: white"
                  data-toggle="tooltip"
                  data-placement="right"
                  title="Sign out"
                ></span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <div
      th:fragment="confirmation-dialog"
      class="modal fade"
      tabindex="-1"
      role="dialog"
      aria-label="Confirmation modal dialog"
      aria-hidden="true"
      id="confirmation-modal"
    >
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-body">
            <p id="modal-body-text">Are you sure?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="modal-btn-yes">
              Yes
            </button>
            <button type="button" class="btn btn-primary" id="modal-btn-no">
              No
            </button>
          </div>
        </div>
      </div>
      <script src="/confirmDelete.js"></script>
    </div>
  </body>
</html>
