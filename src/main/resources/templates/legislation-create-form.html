<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:insert="~{fragments/general.html :: head}"></th:block>
    <title>Create a new Legislation record</title>
  </head>
  <body>
    <th:block th:insert="~{fragments/general.html :: nav}"></th:block>
    <main class="container-fluid">
      <div class="row">
        <div class="col-sm-3"></div>
        <div class="col-sm-5">
          <h1>Create a new Legislation record</h1>
          <p>Title and Text are required.</p>
          <div id="banner"></div>
          <form method="POST" action="#" th:action="@{/legislation}">
            <div>
              <label for="title">Title:</label>
              <input
                class="form-control"
                required
                type="text"
                id="title"
                name="title"
                autofocus
              />
            </div>
            <div>
              <label for="text">Text:</label>
              <textarea
                class="form-control"
                required
                id="text"
                name="text"
              ></textarea>
            </div>
            <div>
              <label for="sponsors">Sponsors:</label>
              <select
                class="form-control"
                id="sponsors"
                name="sponsors"
                multiple
              >
                <option
                  th:each="sponsor: ${sponsors}"
                  th:value="${sponsor.getId()}"
                  th:text="${sponsor.getFullName()}"
                />
              </select>
            </div>
            <div class="text-right">
              <button id="submit" type="submit" class="btn btn-dark">
                Create
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="/create-error-banner.js"></script>
    <script src="/legislation-create-form.js"></script>
  </body>
</html>
