<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:insert="~{fragments/general.html :: head}"></th:block>
    <title>Create a new Legislator record</title>
  </head>
  <body>
    <main class="container-fluid">
      <div class="row">
        <div class="col-sm-3"></div>
        <div class="col-sm-5">
          <h1>Create a new Legislator record</h1>
          <p>All data values are required.</p>
          <div th:insert="~{fragments/general.html :: banner}"></div>
          <form method="POST" action="/legislators">
            <div>
              <label for="firstName">First Name:</label>
              <input
                class="form-control"
                required
                type="text"
                id="firstName"
                name="firstName"
                autofocus
              />
            </div>
            <div>
              <label for="lastName">Last Name:</label>
              <input
                class="form-control"
                required
                type="text"
                id="lastName"
                name="lastName"
              />
            </div>
            <div>
              <label for="hometown">Hometown:</label>
              <input
                class="form-control"
                required
                type="text"
                id="hometown"
                name="hometown"
              />
            </div>
            <div class="text-right">
              <button id="submit" type="submit" class="btn btn-dark">
                Create
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="/legislators-create-form.js"></script>
  </body>
</html>
