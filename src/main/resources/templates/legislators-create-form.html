<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:insert="~{fragments/general.html :: head}"></th:block>
    <title>Create a new Legislator record</title>
  </head>
  <body>
    <th:block th:insert="~{fragments/general.html :: nav}"></th:block>
    <main class="container-fluid">
      <div class="row">
        <div class="col-sm-3"></div>
        <div class="col-sm-5">
          <h1>Create a new Legislator record</h1>
          <p>All data values are required.</p>
          <form
            method="POST"
            action="#"
            class="needs-validation"
            novalidate
            th:action="@{/legislators}"
            th:object="${legislatorDto}"
          >
            <label for="firstName" class="form-label">First Name:</label>
            <div class="input-group has-validation">
              <input
                required
                type="text"
                id="firstName"
                name="firstName"
                autofocus
                th:class="form-control + (${bindingResult != null && bindingResult.getFieldErrorCount('firstName') > 0} ? ' is-invalid' : '')"
                th:field="*{firstName}"
                aria-describedby="firstNameFeedback"
              />
              <div id="firstNameFeedback" class="invalid-feedback">
                First Name is required.
              </div>
            </div>
            <label for="lastName">Last Name:</label>
            <div class="input-group has-validation">
              <input
                class="form-control"
                required
                type="text"
                id="lastName"
                name="lastName"
                th:class="form-control + (${bindingResult != null && bindingResult.getFieldErrorCount('lastName') > 0} ? ' is-invalid' : '')"
                th:field="*{lastName}"
                aria-describedby="lastNameFeedback"
              />
              <div id="lastNameFeedback" class="invalid-feedback">
                Last Name is required.
              </div>
            </div>
            <label for="hometown">Hometown:</label>
            <div class="input-group has-validation">
              <input
                class="form-control"
                required
                type="text"
                id="hometown"
                name="hometown"
                th:class="form-control + (${bindingResult != null && bindingResult.getFieldErrorCount('hometown') > 0} ? ' is-invalid' : '')"
                th:field="*{hometown}"
                aria-describedby="hometownFeedback"
              />
              <div id="hometownFeedback" class="invalid-feedback">
                Hometown is required.
              </div>
            </div>
            <div class="text-right">
              <button id="submit" type="submit" class="btn btn-dark">
                Create
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="/validateRequiredInputs.js"></script>
  </body>
</html>
