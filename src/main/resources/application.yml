debug: false
spring:
  datasource:
    url: jdbc:h2:mem:sampledb
    username: u 
    password: p 
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate.ddl-auto: create-drop
    show-sql: true
  output.ansi.enabled: always
management:
  Xendpoints:
    comment: To enable all actuator endpoints, 1) remove the leading X from the preceding line and 2) remove this line.
    web:
      exposure:
        include: "*"